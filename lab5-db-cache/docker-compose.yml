services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cache_lab
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-buffer-pool-instances=1
      --performance-schema=ON
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
