services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend.py:/app/backend.py
    command: python backend.py

  proxy:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
